<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24405c">
  <title>Duty Planner — برنامج الخدمات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript><p class="pad">يتطلب هذا التطبيق تفعيل JavaScript.</p></noscript>

  <div id="boot" class="boot">جارٍ التحميل…</div>

  <!-- شاشة تسجيل الدخول -->
  <main id="login-screen" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Duty Planner</h1>
      <p class="muted">برنامج الخدمات — تسجيل الدخول</p>
      <label class="field">
        <span>البريد الإلكتروني</span>
        <input id="login-email" type="email" name="email" autocomplete="username" required dir="ltr">
      </label>
      <label class="field">
        <span>كلمة المرور</span>
        <input id="login-password" type="password" name="password" autocomplete="current-password" required dir="ltr">
      </label>
      <div id="login-error" class="notice notice-bad" role="alert" hidden></div>
      <button id="login-btn" class="btn btn-primary btn-block" type="submit">دخول</button>
    </form>
  </main>

  <!-- هيكل التطبيق بعد الدخول -->
  <div id="app-shell" class="app" hidden>
    <aside class="side">
      <div class="brand">
        <strong>Duty Planner</strong>
        <span class="muted">برنامج الخدمات</span>
      </div>
      <nav class="nav" aria-label="التنقل الرئيسي">
        <a href="#/services"    data-route="services"><span aria-hidden="true">📋</span><span>برنامج الخدمات</span></a>
        <a href="#/people"      data-route="people"><span aria-hidden="true">👥</span><span>الأفراد</span></a>
        <a href="#/assignments" data-route="assignments"><span aria-hidden="true">📌</span><span>التعيينات</span></a>
        <a href="#/documents"   data-route="documents"><span aria-hidden="true">📄</span><span>الوثائق والمهام</span></a>
        <a href="#/stats"       data-route="stats"><span aria-hidden="true">📊</span><span>الإحصائيات</span></a>
        <a href="#/settings"    data-route="settings"><span aria-hidden="true">⚙️</span><span>الإعدادات</span></a>
      </nav>
    </aside>

    <div class="content">
      <header class="topbar">
        <h1 id="page-title">برنامج الخدمات</h1>
        <div class="user">
          <span id="user-email" class="muted" dir="ltr"></span>
          <button id="logout-btn" class="btn btn-small" type="button">خروج</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
